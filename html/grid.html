<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>
     <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div class="container">
  <h1 style="color: #f1c40f; margin-bottom: 1.5rem;">Prueba de Grid: Ban vs Checkbox</h1>

  <section class="demo-block">
    <div class="demo-preview">
      
      <div class="row">
        
        <div class="col-12 col-lg-6">
          <img src="../img/ban2.png" alt="Ban" style="border: 1px solid #333; border-radius: 8px; width: 100%;">
        </div>

        <div class="col-12 col-lg-6">
          <div class="demo-box" style="height: 100%; min-height: 120px; flex-direction: row !important;">
            <input type="checkbox" id="pecado">
            <label for="pecado" style="color: white; margin-left: 10px; cursor: pointer;">
              Aceptar Pecado de la Codicia
            </label>
          </div>
        </div>

      </div> </div>
    <div class="demo-toggle">Ver Código <span class="icon-play">▶</span></div>
  </section>

  <p style="color: #f1c40f; margin: 2rem 0 1rem;">REFERENCIAS DE COLUMNAS LG</p>
  
  <div class="row">
    <div class="col-lg-12"><div class="demo-box">.col-lg-12</div></div>
    <div class="col-lg-6"><div class="demo-box">.col-lg-6</div></div>
    <div class="col-lg-6"><div class="demo-box">.col-lg-6</div></div>
    <div class="col-lg-4"><div class="demo-box">.col-lg-4</div></div>
    <div class="col-lg-4"><div class="demo-box">.col-lg-4</div></div>
    <div class="col-lg-4"><div class="demo-box">.col-lg-4</div></div>
  </div>
</div>
</body>
</html>
